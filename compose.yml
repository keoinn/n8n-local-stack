name: n8n-local

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # 不要直接掛 data/postgres：裡面的 .gitkeep 會讓 initdb 以為目錄非空而失敗。
      - ./data/postgres/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.36.8}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: public
      DB_POSTGRESDB_SSL_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_HOST: ${N8N_HOST:-localhost}
      # OAuth callback 看 N8N_EDITOR_BASE_URL；有 NGROK_DOMAIN 時必須蓋掉 .env 的 localhost。
      N8N_EDITOR_BASE_URL: ${NGROK_DOMAIN:+https://${NGROK_DOMAIN}}
      N8N_WEBHOOK_URL: ${NGROK_DOMAIN:+https://${NGROK_DOMAIN}/}
      WEBHOOK_URL: ${NGROK_DOMAIN:+https://${NGROK_DOMAIN}/}
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      # n8n 2.x 預設 callback 要帶 n8n-auth cookie。從 localhost 開編輯器、Google 轉回 ngrok 時 cookie 送不到。
      N8N_SKIP_AUTH_ON_OAUTH_CALLBACK: ${NGROK_DOMAIN:+true}
      N8N_ENDPOINT_HEALTH: health
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: "0.0.0.0"
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_NATIVE_PYTHON_RUNNER: "true"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Taipei}
      TZ: ${GENERIC_TIMEZONE:-Asia/Taipei}
    volumes:
      - ./data/n8n:/home/node/.n8n
      - ./exports:/exports
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  task-runners:
    image: n8n-local-stack:runners
    build:
      context: ./docker/runners
      dockerfile: Dockerfile
      args:
        N8N_RUNNERS_IMAGE: ${N8N_RUNNERS_IMAGE:-n8nio/runners:2.36.8}
        EXTRA_JS_PACKAGES: ${NODE_FUNCTION_ALLOW_EXTERNAL:-pdf-lib}
        EXTRA_PY_PACKAGES: ${N8N_RUNNERS_PY_PACKAGES:-}
        NODE_FUNCTION_ALLOW_BUILTIN: ${NODE_FUNCTION_ALLOW_BUILTIN:-crypto}
        NODE_FUNCTION_ALLOW_EXTERNAL: ${NODE_FUNCTION_ALLOW_EXTERNAL:-pdf-lib}
        N8N_RUNNERS_STDLIB_ALLOW: "${N8N_RUNNERS_STDLIB_ALLOW:-*}"
        N8N_RUNNERS_EXTERNAL_ALLOW: ${N8N_RUNNERS_EXTERNAL_ALLOW:-}
        N8N_RUNNERS_ALLOW_TRANSITIVE_IMPORTS: ${N8N_RUNNERS_ALLOW_TRANSITIVE_IMPORTS:-true}
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: "0"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Taipei}
      NODE_PATH: /opt/n8n-extra-js/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5680/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ngrok-env-check:
    image: busybox:1.37
    profiles:
      - tunnel
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    command:
      - /bin/sh
      - -c
      - |
        fail=0
        token=$$(printf '%s' "$$NGROK_AUTHTOKEN" | tr -d '[:space:]')
        domain=$$(printf '%s' "$$NGROK_DOMAIN" | tr -d '[:space:]')
        if [ -z "$$token" ] || [ "$$token" = "YOUR_NGROK_AUTHTOKEN" ]; then
          echo "請在 .env 填寫 NGROK_AUTHTOKEN（ngrok 官網取得的 Auth Token）。" >&2
          fail=1
        fi
        if [ -z "$$domain" ] || [ "$$domain" = "YOUR_NGROK_DOMAIN" ]; then
          echo "請在 .env 填寫 NGROK_DOMAIN（只要網域，不要加 https://）。" >&2
          fail=1
        fi
        if [ "$$fail" -ne 0 ]; then
          echo "填完後再執行：docker compose --profile tunnel up -d" >&2
          exit 1
        fi

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      ngrok-env-check:
        condition: service_completed_successfully
      n8n:
        condition: service_healthy
    command:
      - http
      - --url=${NGROK_DOMAIN}
      - n8n:5678
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:4040:4040"
